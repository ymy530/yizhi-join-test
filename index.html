<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>易职在家 · 开通会员</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: #f1f7f3; color: #173d2a; font-family: system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; }
    main { width: min(100% - 32px, 520px); margin: 32px auto; padding: 28px 20px; background: #fff; border: 1px solid #dce9df; border-radius: 20px; }
    header { text-align: center; }
    h1 { margin: 0; font-size: clamp(21px, 5.8vw, 28px); line-height: 1.5; }
    .notice { margin: 10px 0 26px; color: #52685a; font-size: 13px; }
    .prices { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; padding: 0; margin: 0 0 26px; list-style: none; }
    .prices li { padding: 12px 10px; border-radius: 10px; background: #eaf5ed; font-size: 15px; font-weight: 600; }
    .placeholders { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
    .placeholder { aspect-ratio: 1; display: flex; align-items: center; justify-content: center; padding: 12px; background: #eceeed; border: 1px solid #d5dad7; border-radius: 10px; color: #525d56; text-align: center; font-size: 14px; line-height: 1.7; }
    .action { margin: 26px 0 20px; color: #216740; font-size: 18px; font-weight: 600; text-align: center; }
    footer { color: #52685a; font-size: 12px; line-height: 1.7; text-align: center; }
    @media (max-width: 340px) { main { padding: 24px 14px; } .placeholders { gap: 10px; } }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>易职在家 · 开通会员</h1>
      <p class="notice">测试页，仅用于测打开速度</p>
    </header>
    <ul class="prices" aria-label="会员价格">
      <li>月卡 ¥39.9</li>
      <li>季卡 ¥99.9</li>
      <li>半年卡 ¥179.9</li>
    </ul>
    <section class="placeholders" aria-label="示例占位框">
      <div class="placeholder">微信二维码（示例）</div>
      <div class="placeholder">收款码（示例）</div>
    </section>
    <p class="action">加微信开通会员</p>
    <footer>本页为测试占位，收款请勿扫页上示例框</footer>
  </main>
</body>
</html>
